<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>爆弾リレー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e13;color:#fff}
button,select{font:inherit}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.hidden{display:none!important}.panel{max-width:760px;margin:0 auto;padding:18px}.card{background:#181d25;border:1px solid #303744;border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
select{width:100%;padding:12px;border-radius:10px;background:#11151b;color:#fff;border:1px solid #39404d}
.primary{background:#fff;color:#111}.secondary{background:#2b313c;color:#fff}.status{padding:10px 12px;border-radius:10px;background:#11151b;margin-top:10px}
#host{position:relative;height:100vh;overflow:hidden;background:#07090d}#game{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.68);padding:10px 12px;border-radius:12px;line-height:1.5;font-size:13px}
#hostBtns{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:8px}
#overlay{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.38);text-align:center}
#overlay .box{background:rgba(0,0,0,.84);padding:22px 28px;border-radius:16px}
#overlayTitle{font-size:34px;font-weight:900}
#controller .badge{font-size:30px;font-weight:900;text-align:center;padding:14px;border-radius:14px;background:#28374f}
#pad{height:180px;margin-top:12px;border-radius:20px;background:#151922;border:1px solid #2d3440;position:relative}
#dot{width:32px;height:32px;border-radius:50%;background:#fff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<section id="home">
<div class="panel">
<h1>爆弾リレー</h1>
<div class="card">
<p>誰か1人が爆弾を持ってスタート。ほかのボールにぶつかると爆弾が移ります。タイマーが0になった瞬間の持ち主が爆発・脱落。最後の1人が勝者です。</p>
<div class="row">
<button id="openHost" class="primary">ゲーム画面のみ表示</button>
<button id="openController" class="secondary">ゲームに参加する</button>
</div>
<p><a href="./index.html" style="color:#fff">← ゲーム一覧へ戻る</a></p>
</div>
</div>
</section>
<section id="controller" class="hidden">
<div style="height:42vh;min-height:260px;background:#080b0f;position:relative;border-bottom:1px solid #333">
<canvas id="spectator" style="width:100%;height:100%;display:block"></canvas>
<div style="position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:6px 9px;border-radius:8px;font-size:12px">ゲーム画面</div>
</div>
<div class="panel"><h2>スマホコントローラー</h2><div id="joinCard" class="card"><label>自分の番号</label><select id="numSelect"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><button id="connectBtn" class="primary" style="width:100%;margin-top:12px">参加する</button><div id="connectStatus" class="status">未接続</div></div><div id="controlCard" class="card hidden"><div id="badge" class="badge">PLAYER</div><button id="sensorBtn" class="primary" style="width:100%;margin-top:12px">傾きセンサーを開始</button><button id="recalibrateBtn" class="secondary" style="width:100%;margin-top:8px">今の角度を水平基準にする</button><div id="tilt" class="status">左右 0.0° / 前後 0.0°</div><div id="wakeStatus" class="status">画面スリープ防止：未開始</div><div id="pad"><div id="dot"></div></div></div></div>
</section>
<section id="host" class="hidden"><canvas id="game"></canvas><div id="hud"><div><strong>爆弾リレー</strong></div><div id="count">参加者 0/10</div><div id="bombInfo">爆弾：待機中</div><div id="timerInfo">残り --.-秒</div></div><div id="hostBtns"><button id="resetBtn">リセット</button><button id="startBtn">開始</button><button id="backBtn" class="secondary">一覧へ</button></div><div id="overlay"><div class="box"><div id="overlayTitle"></div><div id="overlayText"></div></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{
const FIXED_ROOM='yuru-bomb-relay-main';const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const home=document.getElementById('home'),host=document.getElementById('host'),controller=document.getElementById('controller');const params=new URLSearchParams(location.search),mode=params.get('mode');function show(el){home.classList.add('hidden');host.classList.add('hidden');controller.classList.add('hidden');el.classList.remove('hidden')}document.getElementById('openHost').onclick=()=>{history.replaceState(null,'',location.pathname+'?mode=host');show(host);initHost()};document.getElementById('openController').onclick=()=>{history.replaceState(null,'',location.pathname+'?mode=controller');show(controller)};if(mode==='host'){show(host);setTimeout(initHost,0)}else if(mode==='controller')show(controller);document.getElementById('backBtn').onclick=()=>location.href='./index.html';
const numSelect=document.getElementById('numSelect'),connectBtn=document.getElementById('connectBtn'),connectStatus=document.getElementById('connectStatus');const joinCard=document.getElementById('joinCard'),controlCard=document.getElementById('controlCard'),badge=document.getElementById('badge');const sensorBtn=document.getElementById('sensorBtn'),recalibrateBtn=document.getElementById('recalibrateBtn'),tilt=document.getElementById('tilt');const dot=document.getElementById('dot'),wakeStatus=document.getElementById('wakeStatus'),spectator=document.getElementById('spectator');let cPeer=null,cConn=null,selectedNumber=null,sensorActive=false,rawGamma=0,rawBeta=0,baseGamma=0,baseBeta=0,lastSend=0,wakeLock=null;const delta=(v,b)=>{let d=v-b;while(d>180)d-=360;while(d<-180)d+=360;return d};async function wake(){if(!('wakeLock'in navigator)){wakeStatus.textContent='画面スリープ防止：端末非対応';return}try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeStatus.textContent='画面スリープ防止：ON'}catch(e){wakeStatus.textContent='画面スリープ防止：利用不可'}}function ori(e){if(typeof e.gamma==='number')rawGamma=e.gamma;if(typeof e.beta==='number')rawBeta=e.beta;if(!sensorActive||!cConn?.open)return;const now=performance.now();if(now-lastSend<33)return;lastSend=now;const x=clamp(delta(rawGamma,baseGamma),-30,30),y=clamp(delta(rawBeta,baseBeta),-30,30);tilt.textContent=`左右 ${x.toFixed(1)}° / 前後 ${y.toFixed(1)}°`;dot.style.transform=`translate(calc(-50% + ${x/30*62}px),calc(-50% + ${y/30*62}px))`;cConn.send({type:'tilt',x:x/30,y:y/30})}function ensureSensor(){removeEventListener('deviceorientation',ori,true);addEventListener('deviceorientation',ori,true)}
function drawSpectator(d){if(!d||!spectator)return;const r=spectator.getBoundingClientRect(),dp=Math.min(devicePixelRatio||1,2);spectator.width=r.width*dp;spectator.height=r.height*dp;const g=spectator.getContext('2d');g.setTransform(dp,0,0,dp,0,0);g.fillStyle='#07090d';g.fillRect(0,0,r.width,r.height);const sc=Math.min(r.width/d.W,r.height/d.H),ox=(r.width-d.W*sc)/2,oy=(r.height-d.H*sc)/2;g.save();g.translate(ox,oy);g.scale(sc,sc);g.beginPath();g.arc(d.cx,d.cy,d.R,0,Math.PI*2);g.fillStyle='#262c36';g.fill();g.lineWidth=5;g.strokeStyle='#606c80';g.stroke();for(const p of d.players){if(!p.alive)continue;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fillStyle=p.number===d.bomb?'#ff3b30':`hsl(${(p.number-1)*36} 72% 52%)`;g.fill();g.strokeStyle=p.number===d.bomb?'#ffd166':'#111';g.lineWidth=p.number===d.bomb?5:2;g.stroke();g.fillStyle='#fff';g.font='700 12px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(String(p.number),p.x,p.y)}g.restore()}
function connect(retry=false){selectedNumber=selectedNumber||Number(numSelect.value);try{cConn?.close()}catch(e){}try{cPeer?.destroy()}catch(e){}connectStatus.textContent=retry?'再接続中...':'接続中...';cPeer=new Peer();cPeer.on('open',()=>{cConn=cPeer.connect(FIXED_ROOM,{reliable:true});cConn.on('open',async()=>{cConn.send({type:'join',number:selectedNumber});badge.textContent='PLAYER '+selectedNumber;joinCard.classList.add('hidden');controlCard.classList.remove('hidden');connectStatus.textContent='接続済み';await wake();if(sensorActive)ensureSensor()});cConn.on('data',d=>{if(d?.type==='state')drawSpectator(d);if(d?.type==='reject'){if(retry)setTimeout(()=>connect(true),1200);else alert('その番号は使用中です')}if(d?.type==='bomb')badge.textContent='💣 PLAYER '+selectedNumber;if(d?.type==='safe')badge.textContent='PLAYER '+selectedNumber;if(d?.type==='out')tilt.textContent='爆発！脱落しました';if(d?.type==='reset')tilt.textContent='左右 0.0° / 前後 0.0°'});cConn.on('close',()=>setTimeout(()=>connect(true),900)})}connectBtn.onclick=()=>{selectedNumber=Number(numSelect.value);connect(false)};sensorBtn.onclick=async()=>{if(typeof DeviceOrientationEvent==='undefined')return;if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return}ensureSensor();sensorActive=true;await wake();setTimeout(()=>{baseGamma=rawGamma;baseBeta=rawBeta;sensorBtn.textContent='センサー接続済み'},300)};recalibrateBtn.onclick=()=>{baseGamma=rawGamma;baseBeta=rawBeta};document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){await wake();if(sensorActive)ensureSensor();if(selectedNumber&&!cConn?.open)setTimeout(()=>connect(true),700)}});
let hostInit=false;function initHost(){if(hostInit)return;hostInit=true;const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),count=document.getElementById('count'),bombInfo=document.getElementById('bombInfo'),timerInfo=document.getElementById('timerInfo');const resetBtn=document.getElementById('resetBtn'),startBtn=document.getElementById('startBtn'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText');let W=0,H=0,DPR=1,cx=0,cy=0,R=0,last=performance.now(),running=false,bomb=null,bombDeadline=0,audioCtx=null,lastState=0;const players=new Map(),conns=new Map();const peer=new Peer(FIXED_ROOM);function audio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx?.state==='suspended')audioCtx.resume()}function beep(freq=750,d=.08,gain=.35){audio();if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='square';g.gain.setValueAtTime(gain,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+d)}function metal(){audio();if(!audioCtx)return;const n=audioCtx.currentTime,m=audioCtx.createGain();m.gain.setValueAtTime(.8,n);m.gain.exponentialRampToValueAtTime(.001,n+.15);m.connect(audioCtx.destination);[1300,1950,2700].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type=i?'sine':'triangle';g.gain.setValueAtTime([.7,.45,.25][i],n);g.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(g).connect(m);o.start(n);o.stop(n+.15)})}function boom(){audio();if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(120,n);o.frequency.exponentialRampToValueAtTime(35,n+.6);g.gain.setValueAtTime(1,n);g.gain.exponentialRampToValueAtTime(.001,n+.65);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.7)}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H/2;R=Math.min(W,H)*.38;placePlayers()}function createPlayer(n){return{number:n,x:cx,y:cy,vx:0,vy:0,r:Math.max(14,Math.min(W,H)*.025),inputX:0,inputY:0,alive:true,lastHit:0}}function placePlayers(){const alive=[...players.values()].filter(p=>p.alive);alive.forEach((p,i)=>{const a=i/Math.max(1,alive.length)*Math.PI*2;p.x=cx+Math.cos(a)*R*.48;p.y=cy+Math.sin(a)*R*.48;p.vx=p.vy=0})}function chooseBomb(){const alive=[...players.values()].filter(p=>p.alive);bomb=alive.length?alive[Math.floor(Math.random()*alive.length)].number:null;bombDeadline=performance.now()+12000;for(const [n,c] of conns)if(c.open)c.send({type:n===bomb?'bomb':'safe'});bombInfo.textContent=bomb?`爆弾：PLAYER ${bomb}`:'爆弾：なし'}function resetAll(){running=false;bomb=null;for(const p of players.values()){p.alive=true;p.vx=p.vy=0}placePlayers();overlay.style.display='none';bombInfo.textContent='爆弾：待機中';timerInfo.textContent='残り --.-秒';for(const c of conns.values())if(c.open)c.send({type:'reset'})}function aliveCount(){return[...players.values()].filter(p=>p.alive).length}function explode(){if(!bomb)return;const p=players.get(bomb);if(p){p.alive=false;const c=conns.get(bomb);if(c?.open)c.send({type:'out'});boom()}if(aliveCount()<=1){running=false;const winner=[...players.values()].find(p=>p.alive);setTimeout(()=>{overlayTitle.textContent=winner?`PLAYER ${winner.number} WIN!`:'DRAW';overlayText.textContent='最後まで生き残りました';overlay.style.display='flex'},1200);return}setTimeout(()=>{placePlayers();chooseBomb()},900)}peer.on('connection',conn=>{let key=null;conn.on('data',d=>{if(d?.type==='join'){key=Number(d.number);if(conns.has(key)){conn.send({type:'reject'});return}conns.set(key,conn);players.set(key,createPlayer(key));count.textContent=`参加者 ${players.size}/10`;placePlayers()}if(d?.type==='tilt'&&key&&players.has(key)){const p=players.get(key);p.inputX=clamp(+d.x||0,-1,1);p.inputY=clamp(+d.y||0,-1,1)}});conn.on('close',()=>{if(key){conns.delete(key);players.delete(key);count.textContent=`参加者 ${players.size}/10`;placePlayers()}})});function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(!d||d>=min)return;const nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vel=rvx*nx+rvy*ny;if(vel<0){const imp=-(1+.88)*vel/2;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}const now=performance.now();if(now-a.lastHit>100&&now-b.lastHit>100){metal();a.lastHit=b.lastHit=now;if(bomb===a.number||bomb===b.number){bomb=bomb===a.number?b.number:a.number;bombDeadline=performance.now()+Math.max(2500,bombDeadline-performance.now());for(const [n,c] of conns)if(c.open)c.send({type:n===bomb?'bomb':'safe'});bombInfo.textContent=`爆弾：PLAYER ${bomb}`}}}function update(dt){if(!running)return;const now=performance.now();for(const p of players.values()){if(!p.alive)continue;p.vx+=p.inputX*500*dt;p.vy+=p.inputY*500*dt;p.vx*=Math.pow(.986,dt*60);p.vy*=Math.pow(.986,dt*60);const sp=Math.hypot(p.vx,p.vy);if(sp>620){p.vx=p.vx/sp*620;p.vy=p.vy/sp*620}p.x+=p.vx*dt;p.y+=p.vy*dt;const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d>R-p.r){const nx=dx/d,ny=dy/d;p.x=cx+nx*(R-p.r);p.y=cy+ny*(R-p.r);const vn=p.vx*nx+p.vy*ny;if(vn>0){p.vx-=1.7*vn*nx;p.vy-=1.7*vn*ny}}}const a=[...players.values()].filter(p=>p.alive);for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)collide(a[i],a[j]);const rem=(bombDeadline-now)/1000;timerInfo.textContent=`残り ${Math.max(0,rem).toFixed(1)}秒`;if(rem<=0)explode()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#07090d';ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle='#242a34';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#596577';ctx.stroke();for(const p of players.values()){if(!p.alive)continue;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.number===bomb?'#ff3b30':`hsl(${(p.number-1)*36} 72% 52%)`;ctx.fill();ctx.lineWidth=p.number===bomb?6:2;ctx.strokeStyle=p.number===bomb?'#ffd166':'#111';ctx.stroke();if(p.number===bomb){ctx.beginPath();ctx.arc(p.x,p.y,p.r+10+Math.sin(performance.now()/100)*3,0,Math.PI*2);ctx.strokeStyle='rgba(255,70,60,.55)';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.number),p.x,p.y)}}function broadcast(now){if(now-lastState<50)return;lastState=now;const state={type:'state',W,H,cx,cy,R,bomb,players:[...players.values()].map(p=>({number:p.number,x:p.x,y:p.y,r:p.r,alive:p.alive}))};for(const c of conns.values())if(c.open)c.send(state)}function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();broadcast(now);requestAnimationFrame(loop)}resetBtn.onclick=()=>{audio();resetAll()};startBtn.onclick=()=>{audio();for(const p of players.values())p.alive=true;placePlayers();running=true;overlay.style.display='none';chooseBomb();beep(900,.1,.5)};addEventListener('resize',resize);resize();requestAnimationFrame(loop)}})();
</script>
</body>
</html>
