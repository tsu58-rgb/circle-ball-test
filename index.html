<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなのゲーム広場</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101318;color:#fff}
main{max-width:900px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0 0 8px;font-size:32px}
.lead{color:#c7ccd4;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#1a1f27;border:1px solid #303744;border-radius:16px;padding:20px}
.card h2{margin:0 0 8px}
.card p{color:#c7ccd4;line-height:1.6;min-height:52px}
a{display:block;text-align:center;text-decoration:none;background:#fff;color:#111;padding:13px 16px;border-radius:12px;font-weight:800}
.small{font-size:13px;color:#9299a4;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1>みんなのゲーム広場</h1>
  <p class="lead">遊びたいゲームを選んでください。</p>

  <div class="grid">
    <section class="card">
      <h2>ゲーム1｜5対5 円盤バトル</h2>
      <p>赤5人・青5人。スマホを傾けて相手を円盤の外へ押し出します。</p>
      <a href="./game1.html">ゲーム1を開く</a>
    </section>

    <section class="card">
      <h2>ゲーム2｜迷路＋落とし穴レース</h2>
      <p>最大10人が同じ迷路を同時に進み、穴を避けてゴールを目指します。</p>
      <a href="./game2.html">ゲーム2を開く</a>
    </section>
  </div>

  <p class="small">今後 game3.html、game4.html…を追加すれば、この一覧から作品を増やせます。</p>
</main>
</body>
</html>
