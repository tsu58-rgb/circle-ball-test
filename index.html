<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなのゲーム広場</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#101318;
  color:#fff;
}
main{max-width:920px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0 0 8px;font-size:32px}
.lead{color:#c7ccd4;margin:0 0 24px}
#status{color:#aeb5c0;margin:18px 0}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}
.card{
  background:#1a1f27;
  border:1px solid #303744;
  border-radius:16px;
  padding:18px;
}
.card h2{margin:0 0 14px;font-size:22px}
.card a{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#fff;
  color:#111;
  padding:13px 16px;
  border-radius:12px;
  font-weight:800;
}
.empty{
  background:#1a1f27;
  border:1px dashed #3a4250;
  border-radius:16px;
  padding:22px;
  color:#c7ccd4;
}
</style>
</head>
<body>
<main>
  <h1>みんなのゲーム広場</h1>
  <p class="lead">GitHubに追加されたゲームを自動表示します。</p>

  <div id="status">ゲーム一覧を読み込み中...</div>
  <div id="games" class="grid"></div>
</main>

<script>
(async()=>{
  const status=document.getElementById('status');
  const games=document.getElementById('games');

  try{
    const res=await fetch('/api/games',{cache:'no-store'});
    if(!res.ok) throw new Error('一覧取得失敗');

    const data=await res.json();
    const items=Array.isArray(data.games)?data.games:[];

    status.textContent=`${items.length}件のゲーム`;

    if(items.length===0){
      games.innerHTML='<div class="empty">game1.html、game2.html…のようなファイルをGitHubへ追加すると、ここに自動表示されます。</div>';
      return;
    }

    for(const item of items){
      const card=document.createElement('section');
      card.className='card';

      const h=document.createElement('h2');
      h.textContent=`GAME ${item.number}`;

      const a=document.createElement('a');
      a.href=`./${encodeURIComponent(item.file)}`;
      a.textContent='開く';

      card.appendChild(h);
      card.appendChild(a);
      games.appendChild(card);
    }
  }catch(err){
    status.textContent='ゲーム一覧を取得できませんでした。';
    games.innerHTML='<div class="empty">/api/games の取得に失敗しました。</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
