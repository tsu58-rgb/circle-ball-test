<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>レインボースカイサーキット</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05060a;color:#fff}
button,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.hidden{display:none!important}.panel{max-width:760px;margin:0 auto;padding:18px}.card{background:#171b23;border:1px solid #303744;border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}select{width:100%;padding:12px;border-radius:10px;background:#11151b;color:#fff;border:1px solid #39404d}
.primary{background:#fff;color:#111}.secondary{background:#2b313c;color:#fff}.status{padding:10px 12px;border-radius:10px;background:#11151b;margin-top:10px}
#host{position:relative;height:100vh;overflow:hidden;background:#020308}#game{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.7);padding:10px 12px;border-radius:12px;line-height:1.5;font-size:13px}
#hostBtns{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:8px}
#overlay{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.36);text-align:center}
#overlay .box{background:rgba(0,0,0,.84);padding:22px 28px;border-radius:16px}#overlayTitle{font-size:34px;font-weight:900}
#controller .badge{font-size:30px;font-weight:900;text-align:center;padding:14px;border-radius:14px;background:#28374f}
#pad{height:180px;margin-top:12px;border-radius:20px;background:#151922;border:1px solid #2d3440;position:relative}
#dot{width:32px;height:32px;border-radius:50%;background:#fff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<section id="home"><div class="panel"><h1>レインボースカイサーキット</h1><div class="card"><p>宙に浮いたカラフルなコースを真上から見て走ります。コース外へ落ちると3秒後に最後のチェックポイントへ復帰。1周を最速で走り切った人が勝者です。</p><div class="row"><button id="openHost" class="primary">ゲーム画面のみ表示</button><button id="openController" class="secondary">ゲームに参加する</button></div><p><a href="./index.html" style="color:#fff">← ゲーム一覧へ戻る</a></p></div></div></section>
<section id="controller" class="hidden"><div style="height:42vh;min-height:260px;background:#020308;position:relative;border-bottom:1px solid #333"><canvas id="spectator" style="width:100%;height:100%;display:block"></canvas><div style="position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:6px 9px;border-radius:8px;font-size:12px">ゲーム画面</div></div><div class="panel"><h2>スマホコントローラー</h2><div id="joinCard" class="card"><label>自分の番号</label><select id="numSelect"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><button id="connectBtn" class="primary" style="width:100%;margin-top:12px">参加する</button><div id="connectStatus" class="status">未接続</div></div><div id="controlCard" class="card hidden"><div id="badge" class="badge">PLAYER</div><button id="sensorBtn" class="primary" style="width:100%;margin-top:12px">傾きセンサーを開始</button><button id="recalibrateBtn" class="secondary" style="width:100%;margin-top:8px">今の角度を水平基準にする</button><div id="tilt" class="status">左右 0.0° / 前後 0.0°</div><div id="wakeStatus" class="status">画面スリープ防止：未開始</div><div id="pad"><div id="dot"></div></div></div></div></section>
<section id="host" class="hidden"><canvas id="game"></canvas><div id="hud"><div><strong>レインボースカイサーキット</strong></div><div id="count">参加者 0/10</div><div id="rank">順位：なし</div></div><div id="hostBtns"><button id="resetBtn">リセット</button><button id="startBtn">レース開始</button><button id="backBtn" class="secondary">一覧へ</button></div><div id="overlay"><div class="box"><div id="overlayTitle"></div><div id="overlayText"></div></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{
const FIXED_ROOM='yuru-rainbow-sky-race-main';const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const home=document.getElementById('home'),host=document.getElementById('host'),controller=document.getElementById('controller');const params=new URLSearchParams(location.search),mode=params.get('mode');function show(el){home.classList.add('hidden');host.classList.add('hidden');controller.classList.add('hidden');el.classList.remove('hidden')}document.getElementById('openHost').onclick=()=>{history.replaceState(null,'',location.pathname+'?mode=host');show(host);initHost()};document.getElementById('openController').onclick=()=>{history.replaceState(null,'',location.pathname+'?mode=controller');show(controller)};if(mode==='host'){show(host);setTimeout(initHost,0)}else if(mode==='controller')show(controller);document.getElementById('backBtn').onclick=()=>location.href='./index.html';
const numSelect=document.getElementById('numSelect'),connectBtn=document.getElementById('connectBtn'),connectStatus=document.getElementById('connectStatus'),joinCard=document.getElementById('joinCard'),controlCard=document.getElementById('controlCard'),badge=document.getElementById('badge'),sensorBtn=document.getElementById('sensorBtn'),recalibrateBtn=document.getElementById('recalibrateBtn'),tilt=document.getElementById('tilt'),dot=document.getElementById('dot'),wakeStatus=document.getElementById('wakeStatus'),spectator=document.getElementById('spectator');let cPeer=null,cConn=null,selectedNumber=null,sensorActive=false,rawGamma=0,rawBeta=0,baseGamma=0,baseBeta=0,lastSend=0,wakeLock=null;const delta=(v,b)=>{let d=v-b;while(d>180)d-=360;while(d<-180)d+=360;return d};async function wake(){if(!('wakeLock'in navigator)){wakeStatus.textContent='画面スリープ防止：端末非対応';return}try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeStatus.textContent='画面スリープ防止：ON'}catch(e){wakeStatus.textContent='画面スリープ防止：利用不可'}}function ori(e){if(typeof e.gamma==='number')rawGamma=e.gamma;if(typeof e.beta==='number')rawBeta=e.beta;if(!sensorActive||!cConn?.open)return;const now=performance.now();if(now-lastSend<33)return;lastSend=now;const x=clamp(delta(rawGamma,baseGamma),-30,30),y=clamp(delta(rawBeta,baseBeta),-30,30);tilt.textContent=`左右 ${x.toFixed(1)}° / 前後 ${y.toFixed(1)}°`;dot.style.transform=`translate(calc(-50% + ${x/30*62}px),calc(-50% + ${y/30*62}px))`;cConn.send({type:'tilt',x:x/30,y:y/30})}function ensureSensor(){removeEventListener('deviceorientation',ori,true);addEventListener('deviceorientation',ori,true)}
function connect(retry=false){selectedNumber=selectedNumber||Number(numSelect.value);try{cConn?.close()}catch(e){}try{cPeer?.destroy()}catch(e){}connectStatus.textContent=retry?'再接続中...':'接続中...';cPeer=new Peer();cPeer.on('open',()=>{cConn=cPeer.connect(FIXED_ROOM,{reliable:true});cConn.on('open',async()=>{cConn.send({type:'join',number:selectedNumber});badge.textContent='PLAYER '+selectedNumber;joinCard.classList.add('hidden');controlCard.classList.remove('hidden');connectStatus.textContent='接続済み';await wake();if(sensorActive)ensureSensor()});cConn.on('data',d=>{if(d?.type==='state')drawSpectator(d);if(d?.type==='reject'){if(retry)setTimeout(()=>connect(true),1200);else alert('その番号は使用中です')}if(d?.type==='fall')tilt.textContent='コースアウト！3秒後に復帰';if(d?.type==='finish')tilt.textContent=`ゴール！ ${d.place}位`;if(d?.type==='reset')tilt.textContent='左右 0.0° / 前後 0.0°'});cConn.on('close',()=>setTimeout(()=>connect(true),900)})}connectBtn.onclick=()=>{selectedNumber=Number(numSelect.value);connect(false)};sensorBtn.onclick=async()=>{if(typeof DeviceOrientationEvent==='undefined')return;if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')return}ensureSensor();sensorActive=true;await wake();setTimeout(()=>{baseGamma=rawGamma;baseBeta=rawBeta;sensorBtn.textContent='センサー接続済み'},300)};recalibrateBtn.onclick=()=>{baseGamma=rawGamma;baseBeta=rawBeta};document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){await wake();if(sensorActive)ensureSensor();if(selectedNumber&&!cConn?.open)setTimeout(()=>connect(true),700)}});
function drawRoad(g,state){const pts=state.track,width=state.roadWidth;g.lineCap='round';g.lineJoin='round';g.lineWidth=width+18;g.strokeStyle='rgba(0,0,0,.65)';g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);g.closePath();g.stroke();const cols=['#ff3b30','#ff9500','#ffd60a','#34c759','#00c7be','#0a84ff','#5e5ce6','#bf5af2'];for(let k=0;k<cols.length;k++){g.lineWidth=width/cols.length+1;g.strokeStyle=cols[k];g.beginPath();for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length,a=pts[i],b=pts[j],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,off=(k-(cols.length-1)/2)*(width/cols.length);if(i===0)g.moveTo(a.x+nx*off,a.y+ny*off);g.lineTo(b.x+nx*off,b.y+ny*off)}g.closePath();g.stroke()}}
function drawSpectator(d){if(!d||!spectator)return;const r=spectator.getBoundingClientRect(),dp=Math.min(devicePixelRatio||1,2);spectator.width=r.width*dp;spectator.height=r.height*dp;const g=spectator.getContext('2d');g.setTransform(dp,0,0,dp,0,0);g.fillStyle='#020308';g.fillRect(0,0,r.width,r.height);const sc=Math.min(r.width/d.W,r.height/d.H),ox=(r.width-d.W*sc)/2,oy=(r.height-d.H*sc)/2;g.save();g.translate(ox,oy);g.scale(sc,sc);drawRoad(g,d);for(const p of d.players){if(p.finished)continue;g.globalAlpha=p.falling?.35:1;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fillStyle=`hsl(${(p.number-1)*36} 75% 55%)`;g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle='#000';g.font='700 11px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(String(p.number),p.x,p.y)}g.restore()}
let hostInit=false;function initHost(){if(hostInit)return;hostInit=true;const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),count=document.getElementById('count'),rank=document.getElementById('rank'),resetBtn=document.getElementById('resetBtn'),startBtn=document.getElementById('startBtn'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText');let W=0,H=0,DPR=1,last=performance.now(),running=false,audioCtx=null,lastState=0;const players=new Map(),conns=new Map(),finishers=[];const peer=new Peer(FIXED_ROOM);const track=[{x:180,y:520},{x:340,y:560},{x:540,y:540},{x:760,y:500},{x:860,y:410},{x:820,y:300},{x:690,y:240},{x:520,y:250},{x:430,y:330},{x:300,y:350},{x:190,y:280},{x:150,y:170},{x:260,y:100},{x:450,y:120},{x:620,y:150},{x:780,y:120},{x:880,y:180},{x:910,y:300},{x:900,y:430},{x:760,y:520},{x:570,y:590},{x:360,y:600}];const roadWidth=78,checkpoints=[0,5,11,16];function audio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx?.state==='suspended')audioCtx.resume()}function fallSound(){audio();if(!audioCtx)return;const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(420,n);o.frequency.exponentialRampToValueAtTime(60,n+.6);g.gain.setValueAtTime(.8,n);g.gain.exponentialRampToValueAtTime(.001,n+.62);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.65)}function finishSound(){audio();if(!audioCtx)return;[660,880,1100].forEach((f,i)=>{const n=audioCtx.currentTime+i*.1,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.55,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+.27)})}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}function startPos(n){return{x:track[0].x+((n-1)%5)*10,y:track[0].y+Math.floor((n-1)/5)*18}}function createPlayer(n){const s=startPos(n);return{number:n,x:s.x,y:s.y,vx:0,vy:0,r:13,inputX:0,inputY:0,falling:false,fallUntil:0,checkpoint:0,finished:false}}function resetPlayer(p){const idx=checkpoints[p.checkpoint]||0,pt=track[idx];p.x=pt.x;p.y=pt.y;p.vx=p.vy=0;p.falling=false;p.fallUntil=0}function resetAll(){running=false;finishers.length=0;for(const p of players.values()){p.checkpoint=0;p.finished=false;resetPlayer(p)}rank.textContent='順位：なし';overlay.style.display='none';for(const c of conns.values())if(c.open)c.send({type:'reset'})}peer.on('connection',conn=>{let key=null;conn.on('data',d=>{if(d?.type==='join'){key=Number(d.number);if(conns.has(key)){conn.send({type:'reject'});return}conns.set(key,conn);players.set(key,createPlayer(key));count.textContent=`参加者 ${players.size}/10`}if(d?.type==='tilt'&&key&&players.has(key)){const p=players.get(key);p.inputX=clamp(+d.x||0,-1,1);p.inputY=clamp(+d.y||0,-1,1)}});conn.on('close',()=>{if(key){conns.delete(key);players.delete(key);count.textContent=`参加者 ${players.size}/10`}})});function distSeg(px,py,a,b){const vx=b.x-a.x,vy=b.y-a.y,wx=px-a.x,wy=py-a.y,c1=wx*vx+wy*vy,c2=vx*vx+vy*vy,t=clamp(c1/c2,0,1),x=a.x+t*vx,y=a.y+t*vy;return Math.hypot(px-x,py-y)}function onRoad(p){let best=1e9;for(let i=0;i<track.length;i++){const a=track[i],b=track[(i+1)%track.length];best=Math.min(best,distSeg(p.x,p.y,a,b))}return best<roadWidth*.5-p.r*.2}function nearestTrackIndex(p){let best=0,bd=1e9;for(let i=0;i<track.length;i++){const d=Math.hypot(p.x-track[i].x,p.y-track[i].y);if(d<bd){bd=d;best=i}}return best}function updateCheckpoint(p){const idx=nearestTrackIndex(p),target=checkpoints[Math.min(p.checkpoint+1,checkpoints.length-1)];if(p.checkpoint<checkpoints.length-1){if(Math.abs(idx-target)<=1)p.checkpoint++}else if(Math.hypot(p.x-track[0].x,p.y-track[0].y)<45){p.finished=true;finishers.push(p.number);const c=conns.get(p.number);if(c?.open)c.send({type:'finish',place:finishers.length});rank.textContent='順位：'+finishers.map((n,i)=>`${i+1}位 P${n}`).join(' / ');finishSound();if(finishers.length===players.size&&players.size){running=false;overlayTitle.textContent='全員ゴール！';overlayText.textContent=rank.textContent;overlay.style.display='flex'}}}function update(dt){if(!running)return;const now=performance.now();for(const p of players.values()){if(p.finished)continue;if(p.falling){if(now>=p.fallUntil)resetPlayer(p);continue}p.vx+=p.inputX*460*dt;p.vy+=p.inputY*460*dt;p.vx*=Math.pow(.987,dt*60);p.vy*=Math.pow(.987,dt*60);const sp=Math.hypot(p.vx,p.vy);if(sp>560){p.vx=p.vx/sp*560;p.vy=p.vy/sp*560}p.x+=p.vx*dt;p.y+=p.vy*dt;if(!onRoad(p)){p.falling=true;p.fallUntil=now+3000;p.vx=p.vy=0;fallSound();const c=conns.get(p.number);if(c?.open)c.send({type:'fall'});continue}updateCheckpoint(p)}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#020308';ctx.fillRect(0,0,W,H);const sc=Math.min(W/1000,H/650),ox=(W-1000*sc)/2,oy=(H-650*sc)/2;ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);drawRoad(ctx,{track,roadWidth});ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(track[0].x-35,track[0].y-20);ctx.lineTo(track[0].x+35,track[0].y+20);ctx.stroke();for(const p of players.values()){if(p.finished)continue;let rr=p.r;ctx.globalAlpha=1;if(p.falling){const t=1-(p.fallUntil-performance.now())/3000;ctx.globalAlpha=clamp(1-t,.12,1);rr=p.r*(1-t*.7)}ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.fillStyle=`hsl(${(p.number-1)*36} 75% 55%)`;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#000';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.number),p.x,p.y);ctx.globalAlpha=1}ctx.restore()}function broadcast(now){if(now-lastState<50)return;lastState=now;const state={type:'state',W:1000,H:650,track,roadWidth,players:[...players.values()].map(p=>({number:p.number,x:p.x,y:p.y,r:p.r,falling:p.falling,finished:p.finished}))};for(const c of conns.values())if(c.open)c.send(state)}function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();broadcast(now);requestAnimationFrame(loop)}resetBtn.onclick=()=>{audio();resetAll()};startBtn.onclick=()=>{audio();finishers.length=0;for(const p of players.values()){p.checkpoint=0;p.finished=false;resetPlayer(p)}rank.textContent='順位：なし';running=true;overlay.style.display='none'};addEventListener('resize',resize);resize();requestAnimationFrame(loop)}})();
</script>
</body>
</html>
