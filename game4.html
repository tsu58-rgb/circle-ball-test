<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>レインボースカイサーキット</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui;background:#020308;color:#fff}a,button{font:inherit}.hidden{display:none!important}.panel{max-width:760px;margin:auto;padding:18px}.card{background:#171b23;border:1px solid #303744;border-radius:14px;padding:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}.btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:14px 16px;font-weight:800}.primary{background:#fff;color:#111}.secondary{background:#2b313c;color:#fff}select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #39404d;background:#11151b;color:#fff}#host{position:relative;height:100vh}canvas{width:100%;height:100%;display:block}#hud{position:absolute;left:12px;top:12px;background:#000b;padding:10px;border-radius:10px;z-index:2}#ctrl{max-width:760px;margin:auto;padding:14px}.status{padding:10px;background:#11151b;border-radius:10px;margin-top:8px}</style></head><body><section id="home"><div class="panel"><h1>レインボースカイサーキット</h1><div class="card"><p>宙に浮いたレインボーコースを真上から走ります。コース外へ落ちると3秒後に復帰します。</p><div class="row"><a class="btn primary" href="./game4.html?mode=host">ゲーム画面のみ表示</a><a class="btn secondary" href="./game4.html?mode=controller">ゲームに参加する</a></div><p><a href="./index.html" style="color:#fff">← ゲーム一覧へ戻る</a></p></div></div></section><section id="host" class="hidden"><canvas id="game"></canvas><div id="hud"><b>レインボースカイサーキット</b><div id="count">参加者 0/10</div><div id="rank">順位：なし</div><button id="start">レース開始</button><button id="reset">リセット</button><button onclick="location.href='./index.html'">一覧へ</button></div></section><section id="controller" class="hidden"><div style="height:42vh;background:#020308"><canvas id="view"></canvas></div><div id="ctrl"><h2>スマホコントローラー</h2><select id="num"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><button id="join">参加する</button><button id="sensor">傾きセンサーを開始</button><div id="st" class="status">未接続</div></div></section><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script>(()=>{const Q=new URLSearchParams(location.search),m=Q.get('mode'),H=document.getElementById('home'),G=document.getElementById('host'),C=document.getElementById('controller');function show(x){H.classList.add('hidden');G.classList.add('hidden');C.classList.add('hidden');x.classList.remove('hidden')}if(m==='host')show(G);else if(m==='controller')show(C);const ROOM='yuru-rainbow-sky-race-main',cl=(v,a,b)=>Math.max(a,Math.min(b,v));const track=[{x:160,y:520},{x:320,y:570},{x:520,y:550},{x:760,y:500},{x:880,y:390},{x:820,y:260},{x:620,y:220},{x:460,y:280},{x:300,y:340},{x:170,y:280},{x:120,y:160},{x:260,y:90},{x:500,y:120},{x:740,y:100},{x:900,y:190},{x:900,y:360},{x:760,y:510},{x:520,y:600},{x:300,y:600}],road=82;function roadDraw(g){g.lineCap='round';g.lineJoin='round';const cols=['#ff3b30','#ff9500','#ffd60a','#34c759','#00c7be','#0a84ff','#5e5ce6','#bf5af2'];for(let k=0;k<cols.length;k++){g.lineWidth=road/cols.length+1;g.strokeStyle=cols[k];g.beginPath();for(let i=0;i<track.length;i++){const a=track[i],b=track[(i+1)%track.length],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,o=(k-3.5)*(road/cols.length);if(i===0)g.moveTo(a.x+nx*o,a.y+ny*o);g.lineTo(b.x+nx*o,b.y+ny*o)}g.closePath();g.stroke()}}function seg(px,py,a,b){const vx=b.x-a.x,vy=b.y-a.y,t=cl(((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy),0,1),x=a.x+t*vx,y=a.y+t*vy;return Math.hypot(px-x,py-y)}if(m==='controller'){let peer,conn,n=1,sg=0,sb=0,rg=0,rb=0,last=0,active=false;const st=document.getElementById('st'),view=document.getElementById('view');document.getElementById('join').onclick=()=>{n=+document.getElementById('num').value;peer=new Peer();peer.on('open',()=>{conn=peer.connect(ROOM,{reliable:true});conn.on('open',()=>{conn.send({type:'join',number:n});st.textContent='接続済み'});conn.on('data',d=>{if(d.type==='state')drawState(d);if(d.type==='fall')st.textContent='コースアウト！3秒後に復帰';if(d.type==='finish')st.textContent=`ゴール！ ${d.place}位`})})};document.getElementById('sensor').onclick=async()=>{if(typeof DeviceOrientationEvent.requestPermission==='function'&&(await DeviceOrientationEvent.requestPermission())!=='granted')return;active=true;sg=rg;sb=rb;addEventListener('deviceorientation',e=>{if(typeof e.gamma==='number')rg=e.gamma;if(typeof e.beta==='number')rb=e.beta;if(!active||!conn?.open)return;const now=performance.now();if(now-last<33)return;last=now;conn.send({type:'tilt',x:cl((rg-sg)/30,-1,1),y:cl((rb-sb)/30,-1,1)})},true)};function drawState(d){const r=view.getBoundingClientRect(),p=Math.min(devicePixelRatio||1,2);view.width=r.width*p;view.height=r.height*p;const g=view.getContext('2d');g.setTransform(p,0,0,p,0,0);g.fillStyle='#020308';g.fillRect(0,0,r.width,r.height);const s=Math.min(r.width/1000,r.height/650),ox=(r.width-1000*s)/2,oy=(r.height-650*s)/2;g.save();g.translate(ox,oy);g.scale(s,s);roadDraw(g);for(const q of d.players){if(q.finished)continue;g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fillStyle=`hsl(${(q.number-1)*36} 75% 55%)`;g.fill();g.strokeStyle='#fff';g.stroke()}g.restore()}}if(m==='host'){const cv=document.getElementById('game'),ctx=cv.getContext('2d'),players=new Map(),conns=new Map(),finish=[],peer=new Peer(ROOM);let W,H,s,ox,oy,last=performance.now(),run=false;function resize(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);s=Math.min(W/1000,H/650);ox=(W-1000*s)/2;oy=(H-650*s)/2}function make(n){return{number:n,x:track[0].x,y:track[0].y,vx:0,vy:0,r:13,ix:0,iy:0,fall:0,cp:0,finished:false}}peer.on('connection',c=>{let k;c.on('data',d=>{if(d.type==='join'){k=+d.number;if(conns.has(k))return;c.send({type:'ok'});conns.set(k,c);players.set(k,make(k));document.getElementById('count').textContent=`参加者 ${players.size}/10`}if(d.type==='tilt'&&players.has(k)){let p=players.get(k);p.ix=d.x;p.iy=d.y}});c.on('close',()=>{if(k){conns.delete(k);players.delete(k)}})});function nearest(p){let b=1e9,i=0;for(let j=0;j<track.length;j++){let d=Math.hypot(p.x-track[j].x,p.y-track[j].y);if(d<b){b=d;i=j}}return i}function onroad(p){let b=1e9;for(let i=0;i<track.length;i++)b=Math.min(b,seg(p.x,p.y,track[i],track[(i+1)%track.length]));return b<road*.5}function update(dt){if(!run)return;const now=performance.now();for(const p of players.values()){if(p.finished)continue;if(p.fall){if(now>=p.fall){let q=track[p.cp];p.x=q.x;p.y=q.y;p.vx=p.vy=0;p.fall=0}continue}p.vx+=p.ix*440*dt;p.vy+=p.iy*440*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!onroad(p)){p.fall=now+3000;conns.get(p.number)?.send({type:'fall'});continue}let ni=nearest(p);if(ni>p.cp&&ni-p.cp<5)p.cp=ni;if(p.cp>track.length-4&&Math.hypot(p.x-track[0].x,p.y-track[0].y)<45){p.finished=true;finish.push(p.number);document.getElementById('rank').textContent='順位：'+finish.map((n,i)=>`${i+1}位 P${n}`).join(' / ');conns.get(p.number)?.send({type:'finish',place:finish.length})}}}function draw(){ctx.fillStyle='#020308';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);roadDraw(ctx);for(const p of players.values()){if(p.finished)continue;ctx.globalAlpha=p.fall?.35:1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`hsl(${(p.number-1)*36} 75% 55%)`;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#000';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.number,p.x,p.y)}ctx.globalAlpha=1;ctx.restore()}function broad(){const d={type:'state',players:[...players.values()].map(p=>({number:p.number,x:p.x,y:p.y,r:p.r,finished:p.finished}))};for(const c of conns.values())if(c.open)c.send(d)}function loop(n){let dt=Math.min((n-last)/1000,.033);last=n;update(dt);draw();broad();requestAnimationFrame(loop)}document.getElementById('start').onclick=()=>{finish.length=0;for(const p of players.values())Object.assign(p,make(p.number));run=true;document.getElementById('rank').textContent='順位：なし'};document.getElementById('reset').onclick=()=>{run=false;finish.length=0;for(const p of players.values())Object.assign(p,make(p.number))};addEventListener('resize',resize);resize();requestAnimationFrame(loop)}})();</script></body></html>
