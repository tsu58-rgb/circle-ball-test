<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>5対5 円板ボールバトル</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1115;color:#fff}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}#home,#controller,#host{min-height:100vh}.panel{max-width:760px;margin:0 auto;padding:20px}.card{background:#1a1d24;border:1px solid #2a2f3a;border-radius:14px;padding:16px;margin:12px 0}h1,h2{margin:0 0 14px}p{line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}label{display:block;margin:10px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #39404d;background:#11151b;color:#fff}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:#fff;color:#111}button.secondary{background:#2a303b;color:#fff}.big{font-size:20px;padding:16px 20px}.status{padding:10px 12px;border-radius:10px;background:#11151b;margin-top:10px}#host{position:relative;overflow:hidden;height:100vh;background:#090b0f}#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hostHud{position:absolute;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.62);padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5}#hostControls{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}#roomBox{font-size:20px;font-weight:800;letter-spacing:.06em}#scoreBox{margin-top:6px}#messageOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;background:rgba(0,0,0,.35);text-align:center}#messageOverlay .box{background:rgba(0,0,0,.78);padding:22px 28px;border-radius:16px}#messageOverlay .title{font-size:32px;font-weight:900}#messageOverlay .sub{margin-top:8px}#controller .teamBadge{font-size:28px;font-weight:900;text-align:center;padding:16px;border-radius:14px}#controller .teamBadge.red{background:#7d2421}#controller .teamBadge.blue{background:#1e4f95}#tilt{font-size:18px;text-align:center;line-height:1.7}#pad{height:190px;border-radius:20px;background:#151922;border:1px solid #2d3440;display:flex;align-items:center;justify-content:center;margin-top:14px;position:relative;overflow:hidden}#dot{width:34px;height:34px;border-radius:50%;background:#fff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.small{font-size:12px;opacity:.78}
@media(max-width:600px){.panel{padding:14px}#hostControls button{padding:9px 10px;font-size:12px}#hostHud{font-size:11px}}
</style>
</head>
<body>
<section id="home"><div class="panel"><h1>5対5 円板ボールバトル</h1><div class="card"><p>PCで共通円盤を開き、各スマホは赤/青と番号を選ぶだけで同じ円盤に参加します。</p><div class="row"><button id="openHost" class="big">ゲーム画面のみ表示</button><button id="openController" class="big secondary">ゲームに参加する</button></div></div></div></section>
<section id="controller" class="hidden">
  <div style="height:42vh;min-height:260px;background:#090b0f;position:relative;border-bottom:1px solid #333">
    <canvas id="spectatorCanvas1" style="width:100%;height:100%;display:block"></canvas>
    <div style="position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:6px 9px;border-radius:8px;font-size:12px">ゲーム画面</div>
  </div><div class="panel"><h2>スマホコントローラー</h2><div id="joinCard" class="card"><div class="row"><div><label for="teamSelect">チーム</label><select id="teamSelect"><option value="red">赤</option><option value="blue">青</option></select></div><div><label for="numSelect">番号</label><select id="numSelect"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div></div><button id="connectBtn" class="big" style="width:100%;margin-top:14px">共通円盤に参加</button><div id="connectStatus" class="status">未接続</div></div><div id="controlCard" class="card hidden"><div id="teamBadge" class="teamBadge"></div><button id="sensorBtn" class="big" style="width:100%;margin-top:14px">傾きセンサーを開始</button><button id="recalibrateBtn" class="secondary" style="width:100%;margin-top:8px">今の角度を水平基準にする</button><div id="tilt" class="status">左右 0.0° / 前後 0.0°</div><div id="wakeStatus" class="status">画面スリープ防止：未開始</div><div id="pad"><div id="dot"></div></div><p class="small">スマホを傾けると、PC画面上の自分のボールが動きます。</p></div></div></section>
<section id="host" class="hidden"><canvas id="gameCanvas"></canvas><div id="hostHud"><div id="roomBox">共通円盤・接続受付中</div><div id="scoreBox">赤 0/5　青 0/5</div><div id="playerList"></div></div><div id="hostControls"><button id="resetHostBtn">リセット</button><button id="startHostBtn">試合開始</button><button id="backHomeBtn" class="secondary">戻る</button></div><div id="messageOverlay"><div class="box"><div class="title" id="overlayTitle"></div><div class="sub" id="overlaySub"></div></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{
const home=document.getElementById('home'),hostSection=document.getElementById('host'),controllerSection=document.getElementById('controller');
const params=new URLSearchParams(location.search);const mode=params.get('mode');
  const spectatorCanvas1=document.getElementById('spectatorCanvas1');
  function drawSpectator1(d){
    if(!spectatorCanvas1||!d)return;
    const r=spectatorCanvas1.getBoundingClientRect(),dp=Math.min(devicePixelRatio||1,2);
    spectatorCanvas1.width=Math.max(1,Math.round(r.width*dp));spectatorCanvas1.height=Math.max(1,Math.round(r.height*dp));
    const g=spectatorCanvas1.getContext('2d');g.setTransform(dp,0,0,dp,0,0);
    const w=r.width,h=r.height,sc=Math.min(w/d.W,h/d.H),ox=(w-d.W*sc)/2,oy=(h-d.H*sc)/2;
    g.fillStyle='#090b0f';g.fillRect(0,0,w,h);g.save();g.translate(ox,oy);g.scale(sc,sc);
    g.beginPath();g.arc(d.cx,d.cy,d.boardR,0,Math.PI*2);g.fillStyle='#d8c59d';g.fill();g.lineWidth=5;g.strokeStyle='#756344';g.stroke();
    for(const p of d.players||[]){if(!p.alive&&!p.falling)continue;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fillStyle=p.team==='red'?'#d94a43':'#3f7ddd';g.fill();g.strokeStyle='#111';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.font=`700 ${Math.max(10,p.r*.9)}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(p.number),p.x,p.y)}
    g.restore();
  }
let hostStarted=false;
function showOnly(x){home.classList.add('hidden');hostSection.classList.add('hidden');controllerSection.classList.add('hidden');x.classList.remove('hidden')}
document.getElementById('openHost').onclick=()=>{history.replaceState(null,'',location.pathname+'?mode=host');showOnly(hostSection);initHost()};
document.getElementById('openController').onclick=()=>{history.replaceState(null,'',location.pathname+'?mode=controller');showOnly(controllerSection)};
document.getElementById('backHomeBtn').onclick=()=>location.href=location.pathname;
if(mode==='host'){showOnly(hostSection);setTimeout(initHost,0)}else if(mode==='controller'){showOnly(controllerSection)}

// controller
const teamSelect=document.getElementById('teamSelect'),numSelect=document.getElementById('numSelect'),connectBtn=document.getElementById('connectBtn'),connectStatus=document.getElementById('connectStatus'),joinCard=document.getElementById('joinCard'),controlCard=document.getElementById('controlCard'),sensorBtn=document.getElementById('sensorBtn'),recalibrateBtn=document.getElementById('recalibrateBtn'),teamBadge=document.getElementById('teamBadge'),tiltEl=document.getElementById('tilt'),dot=document.getElementById('dot'),wakeStatus=document.getElementById('wakeStatus');
let controllerPeer=null,controllerConn=null,sensorActive=false,rawGamma=0,rawBeta=0,baseGamma=0,baseBeta=0,lastSend=0;
let wakeLock=null,reconnectTimer=null,selectedTeam=null,selectedNumber=null,hasJoinedOnce=false,reconnecting=false;
const FIXED_ROOM='yuru-circle-ball-main';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const deltaAngle=(v,b)=>{let d=v-b;while(d>180)d-=360;while(d<-180)d+=360;return d};

async function requestWakeLock(){
  if(!('wakeLock' in navigator)){wakeStatus.textContent='画面スリープ防止：端末非対応';return}
  try{
    if(wakeLock&&!wakeLock.released){wakeStatus.textContent='画面スリープ防止：ON';return}
    wakeLock=await navigator.wakeLock.request('screen');
    wakeStatus.textContent='画面スリープ防止：ON';
    wakeLock.addEventListener('release',()=>{wakeStatus.textContent='画面スリープ防止：復帰待ち'});
  }catch(e){
    wakeStatus.textContent='画面スリープ防止：利用できません';
  }
}
function ensureOrientationListener(){
  window.removeEventListener('deviceorientation',orientationHandler,true);
  window.addEventListener('deviceorientation',orientationHandler,true);
}
function cleanupController(){
  try{controllerConn?.close()}catch(e){}
  controllerConn=null;
  try{if(controllerPeer&&!controllerPeer.destroyed)controllerPeer.destroy()}catch(e){}
  controllerPeer=null;
}
function scheduleReconnect(){
  if(document.visibilityState!=='visible'||!hasJoinedOnce)return;
  clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(()=>{if(!controllerConn?.open)connectController(true)},800);
}
function connectController(isReconnect=false){
  if(reconnecting)return;
  reconnecting=true;
  if(!selectedTeam)selectedTeam=teamSelect.value;
  if(!selectedNumber)selectedNumber=Number(numSelect.value);
  connectStatus.textContent=isReconnect?'再接続中...':'共通円盤へ接続中...';
  cleanupController();
  controllerPeer=new Peer();
  controllerPeer.on('open',()=>{
    controllerConn=controllerPeer.connect(FIXED_ROOM,{reliable:true});
    controllerConn.on('open',async()=>{
      controllerConn.send({type:'join',team:selectedTeam,number:selectedNumber});
      hasJoinedOnce=true;
      reconnecting=false;
      teamBadge.textContent=(selectedTeam==='red'?'赤':'青')+selectedNumber;
      teamBadge.className='teamBadge '+selectedTeam;
      joinCard.classList.add('hidden');
      controlCard.classList.remove('hidden');
      connectStatus.textContent='接続済み';
      if(sensorActive){ensureOrientationListener();tiltEl.textContent='接続復帰。操作できます'}
      await requestWakeLock();
    });
    controllerConn.on('data',data=>{
      if(data?.type==='state') drawSpectator1(data);
      if(data?.type==='reject'){
        reconnecting=false;
        if(isReconnect){setTimeout(()=>connectController(true),1200);return}
        alert(data.message||'この番号は使用中です');
        return;
      }
      if(data?.type==='eliminated')tiltEl.textContent='脱落しました';
      if(data?.type==='reset')tiltEl.textContent='左右 0.0° / 前後 0.0°';
    });
    controllerConn.on('close',()=>{connectStatus.textContent='接続が切れました。自動再接続します';reconnecting=false;scheduleReconnect()});
    controllerConn.on('error',()=>{connectStatus.textContent='接続エラー。自動再接続します';reconnecting=false;scheduleReconnect()});
  });
  controllerPeer.on('error',()=>{reconnecting=false;scheduleReconnect()});
}
connectBtn.onclick=()=>{
  selectedTeam=teamSelect.value;
  selectedNumber=Number(numSelect.value);
  connectController(false);
};

function sendTilt(now){if(!controllerConn?.open||!sensorActive||now-lastSend<33)return;lastSend=now;const x=clamp(deltaAngle(rawGamma,baseGamma),-30,30),y=clamp(deltaAngle(rawBeta,baseBeta),-30,30);tiltEl.textContent=`左右 ${x.toFixed(1)}° / 前後 ${y.toFixed(1)}°`;const px=clamp(x/30,-1,1)*65,py=clamp(y/30,-1,1)*65;dot.style.transform=`translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;controllerConn.send({type:'tilt',x:x/30,y:y/30})}
function orientationHandler(e){if(typeof e.gamma==='number')rawGamma=e.gamma;if(typeof e.beta==='number')rawBeta=e.beta;sendTilt(performance.now())}
sensorBtn.onclick=async()=>{
  try{
    if(typeof DeviceOrientationEvent==='undefined'){alert('この端末では傾きセンサーを利用できません');return}
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){alert('傾きセンサーが許可されませんでした');return}
    }
    ensureOrientationListener();
    sensorActive=true;
    await requestWakeLock();
    setTimeout(()=>{
      baseGamma=rawGamma;
      baseBeta=rawBeta;
      sensorBtn.textContent='センサー接続済み';
      tiltEl.textContent='左右 0.0° / 前後 0.0°';
    },300);
  }catch(e){alert('センサー開始エラー: '+e.message)}
};
recalibrateBtn.onclick=()=>{baseGamma=rawGamma;baseBeta=rawBeta};
async function restoreController(){
  if(document.visibilityState!=='visible')return;
  await requestWakeLock();
  if(sensorActive)ensureOrientationListener();
  if(hasJoinedOnce&&!controllerConn?.open)scheduleReconnect();
}
document.addEventListener('visibilitychange',restoreController);
window.addEventListener('pageshow',restoreController);
window.addEventListener('focus',restoreController);


// host
function initHost(){if(hostStarted)return;hostStarted=true;const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),roomBox=document.getElementById('roomBox'),scoreBox=document.getElementById('scoreBox'),playerList=document.getElementById('playerList'),resetBtn=document.getElementById('resetHostBtn'),startBtn=document.getElementById('startHostBtn'),messageOverlay=document.getElementById('messageOverlay'),overlayTitle=document.getElementById('overlayTitle'),overlaySub=document.getElementById('overlaySub');let W=0,H=0,DPR=1,cx=0,cy=0,boardR=0,gameRunning=false,gameEnded=false,last=performance.now(),audioCtx=null,pendingWinnerTimer=null;const players=new Map(),slotConns=new Map();const peerId=FIXED_ROOM;const hostPeer=new Peer(peerId);hostPeer.on('open',()=>roomBox.textContent='共通円盤・接続受付中');hostPeer.on('connection',conn=>{let assignedKey=null;conn.on('data',data=>{if(!data?.type)return;if(data.type==='join'){const team=data.team==='blue'?'blue':'red',number=Math.max(1,Math.min(5,Number(data.number)||1)),key=team+number;if(slotConns.has(key)){conn.send({type:'reject',message:`${team==='red'?'赤':'青'}${number} はすでに使用中です`});return}assignedKey=key;slotConns.set(key,conn);players.set(key,createBall(team,number));resetPositions();updateHud()}if(data.type==='tilt'&&assignedKey&&players.has(assignedKey)){const p=players.get(assignedKey);p.inputX=clamp(Number(data.x)||0,-1,1);p.inputY=clamp(Number(data.y)||0,-1,1)}});conn.on('close',()=>{if(assignedKey){slotConns.delete(assignedKey);players.delete(assignedKey);resetPositions();updateHud()}})});
function createBall(team,number){return{team,number,x:cx,y:cy,vx:0,vy:0,r:Math.max(14,Math.min(W,H)*.024),baseR:Math.max(14,Math.min(W,H)*.024),inputX:0,inputY:0,alive:true,falling:false,fallStart:0,fallDuration:900,fallStartX:0,fallStartY:0,fallVX:0,fallVY:0,lastHitSound:0}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H/2;boardR=Math.min(W,H)*.39;resetPositions()}
function positionTeam(arr,side){const spacing=Math.max(34,boardR*.18);arr.forEach((p,i)=>{const off=(i-(arr.length-1)/2)*spacing;p.x=cx+side*boardR*.42;p.y=cy+off;p.r=Math.max(14,Math.min(W,H)*.024)})}
function resetPositions(){positionTeam([...players.values()].filter(p=>p.team==='red').sort((a,b)=>a.number-b.number),-1);positionTeam([...players.values()].filter(p=>p.team==='blue').sort((a,b)=>a.number-b.number),1);for(const p of players.values()){p.vx=0;p.vy=0;p.inputX=0;p.inputY=0;p.alive=true}gameEnded=false;if(pendingWinnerTimer){clearTimeout(pendingWinnerTimer);pendingWinnerTimer=null}messageOverlay.style.display='none';for(const c of slotConns.values())if(c.open)c.send({type:'reset'});updateHud()}
function ensureAudio(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx?.state==='suspended')audioCtx.resume()}catch(e){}}
function playCollisionSound(strength=1){
  ensureAudio();
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const master=audioCtx.createGain();
  master.gain.setValueAtTime(Math.min(.18,.055+strength*.03),now);
  master.gain.exponentialRampToValueAtTime(.001,now+.24);
  master.connect(audioCtx.destination);

  // 金属同士が「カンッ」と当たるような複数の高周波成分
  [1180,1760,2470,3310].forEach((freq,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=i%2===0?'triangle':'sine';
    osc.frequency.setValueAtTime(freq+(strength*35),now);
    osc.frequency.exponentialRampToValueAtTime(freq*.88,now+.16+i*.015);
    gain.gain.setValueAtTime([.7,.48,.30,.18][i],now);
    gain.gain.exponentialRampToValueAtTime(.001,now+.12+i*.025);
    osc.connect(gain).connect(master);
    osc.start(now);
    osc.stop(now+.22);
  });

  // 短い打撃ノイズ
  const len=Math.floor(audioCtx.sampleRate*.035);
  const buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const noise=audioCtx.createBufferSource();
  const filter=audioCtx.createBiquadFilter();
  const ng=audioCtx.createGain();
  noise.buffer=buffer;
  filter.type='highpass';
  filter.frequency.value=1500;
  ng.gain.setValueAtTime(.22,now);
  ng.gain.exponentialRampToValueAtTime(.001,now+.04);
  noise.connect(filter).connect(ng).connect(master);
  noise.start(now);
}
function playFallSound(){ensureAudio();if(!audioCtx)return;const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(430,now);osc.frequency.exponentialRampToValueAtTime(85,now+.5);gain.gain.setValueAtTime(.13,now);gain.gain.exponentialRampToValueAtTime(.001,now+.52);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+.54)}
function updateHud(){const r=[...players.values()].filter(p=>p.team==='red'&&p.alive).length,b=[...players.values()].filter(p=>p.team==='blue'&&p.alive).length;scoreBox.textContent=`赤 ${r}/5　青 ${b}/5`;playerList.textContent=[...players.values()].sort((a,b)=>a.team.localeCompare(b.team)||a.number-b.number).map(p=>`${p.team==='red'?'赤':'青'}${p.number}${p.alive?'':'×'}`).join('　')||'参加者待機中'}
function checkWinner(){if(gameEnded||!gameRunning)return;const rt=[...players.values()].filter(p=>p.team==='red').length,bt=[...players.values()].filter(p=>p.team==='blue').length;if(!rt||!bt)return;const r=[...players.values()].filter(p=>p.team==='red'&&(p.alive||p.falling)).length,b=[...players.values()].filter(p=>p.team==='blue'&&(p.alive||p.falling)).length;if(r===0||b===0){gameEnded=true;gameRunning=false;const title=r===0&&b===0?'DRAW':r===0?'青チーム WIN!':'赤チーム WIN!';if(pendingWinnerTimer)clearTimeout(pendingWinnerTimer);pendingWinnerTimer=setTimeout(()=>{overlayTitle.textContent=title;overlaySub.textContent='リセットしてもう一度遊べます';messageOverlay.style.display='flex';pendingWinnerTimer=null},2000)}}
function eliminate(p){if(!p.alive||p.falling)return;p.alive=false;p.falling=true;p.fallStart=performance.now();p.fallStartX=p.x;p.fallStartY=p.y;p.fallVX=p.vx;p.fallVY=p.vy;playFallSound();const c=slotConns.get(p.team+p.number);if(c?.open)c.send({type:'eliminated'});updateHud()}
function finishFall(p){if(!p.falling)return;p.falling=false;p.vx=p.vy=0;updateHud();checkWinner()}
function resolveCollision(a,b){const dx=b.x-a.x,dy=b.y-a.y;let dist=Math.hypot(dx,dy),min=a.r+b.r;if(dist===0)dist=.001;if(dist>=min)return;const nx=dx/dist,ny=dy/dist,over=min-dist;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vel=rvx*nx+rvy*ny;if(vel>0)return;const impulse=-(1+.92)*vel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;const impact=Math.min(3,Math.abs(vel)/180),now=performance.now();if(impact>.18&&now-a.lastHitSound>90&&now-b.lastHitSound>90){playCollisionSound(impact);a.lastHitSound=b.lastHitSound=now}}
function update(dt){const anyFalling=[...players.values()].some(p=>p.falling);if(!gameRunning&&!anyFalling)return;const acceleration=560,friction=Math.pow(.988,dt*60),maxSpeed=700,now=performance.now();for(const p of players.values()){if(p.falling){const t=Math.min(1,(now-p.fallStart)/p.fallDuration),e=t*t;p.x=p.fallStartX+p.fallVX*.22*t;p.y=p.fallStartY+p.fallVY*.22*t+150*e;p.r=Math.max(2,p.baseR*(1-t*.88));if(t>=1)finishFall(p);continue}if(!p.alive)continue;p.vx+=p.inputX*acceleration*dt;p.vy+=p.inputY*acceleration*dt;p.vx*=friction;p.vy*=friction;const sp=Math.hypot(p.vx,p.vy);if(sp>maxSpeed){p.vx=p.vx/sp*maxSpeed;p.vy=p.vy/sp*maxSpeed}p.x+=p.vx*dt;p.y+=p.vy*dt}const alive=[...players.values()].filter(p=>p.alive&&!p.falling);for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++)resolveCollision(alive[i],alive[j]);for(const p of alive)if(Math.hypot(p.x-cx,p.y-cy)>boardR+p.r*.45)eliminate(p)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#090b0f';ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.arc(cx+10,cy+14,boardR,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,boardR,0,Math.PI*2);ctx.fillStyle='#d8c59d';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#756344';ctx.stroke();for(const p of players.values()){if(!p.alive&&!p.falling)continue;let alpha=1;if(p.falling){const t=Math.min(1,(performance.now()-p.fallStart)/p.fallDuration);alpha=1-t*.82}ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.ellipse(p.x+6,p.y+8,p.r*.9,p.r*.5,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.24)';ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.team==='red'?'#d94a43':'#3f7ddd';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=p.team==='red'?'#741f1b':'#173e7b';ctx.stroke();if(p.r>8){ctx.fillStyle='#fff';ctx.font=`700 ${Math.max(10,p.r*.9)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.number),p.x,p.y+1)}ctx.restore()}}
let lastStateSend=0;
    function broadcastState(now){
      if(now-lastStateSend<50)return;
      lastStateSend=now;
      const state=[...players.values()].map(p=>({team:p.team,number:p.number,x:p.x,y:p.y,r:p.r,alive:p.alive,falling:p.falling}));
      for(const c of slotConns.values())if(c.open)c.send({type:'state',cx,cy,boardR,W,H,players:state});
    }
    function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();broadcastState(now);requestAnimationFrame(loop)}
resetBtn.onclick=()=>{ensureAudio();gameRunning=false;resetPositions()};startBtn.onclick=()=>{ensureAudio();resetPositions();gameRunning=true;overlayTitle.textContent='START!';overlaySub.textContent='';messageOverlay.style.display='flex';setTimeout(()=>messageOverlay.style.display='none',700)};addEventListener('resize',resize);resize();requestAnimationFrame(loop)}
})();
</script>
